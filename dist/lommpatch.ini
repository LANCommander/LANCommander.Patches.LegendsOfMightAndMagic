; Legends of Might and Magic patch (lommpatch) settings. Set a switch to 0 to turn that fix off.
;
; These are the DEFAULTS. Your own settings are console variables in autoexec.cfg in the save folder
; (%USERPROFILE%\Saved Games\New World Computing\Legends of Might and Magic), named as in brackets below, e.g.
; "HorPlus" "1". The first time the game runs with the patch they are added there from this file; after that, change
; them in autoexec.cfg, in the console (HorPlus 0) or in the game's menus. [General] and [Saves] are read from here
; only. The dedicated server (LegendServ.exe) reads this file only.
; The game's own settings, which it used to keep in the registry, are console variables in autoexec.cfg as well (see
; README.md). The LANCommander Interposer plugin build reads these defaults from
; Plugins.LegendsOfMightAndMagic.<Section>.<Key> in .interposer\Config.yml instead.

[General]
; 0 = the patch does nothing
Enabled=1

[Saves]
; autoexec.cfg (settings and key bindings), favorites.txt, buddylist.txt, ROTATION.TXT, screenshots and logs in the
; save folder instead of the install folder. The install folder's files are copied over the first time.
Redirect=1
; the save folder (environment variables allowed); empty = %USERPROFILE%\Saved Games\New World Computing\Legends of
; Might and Magic (where Windows keeps Saved Games, if it was moved)
Folder=
; the game's own settings in autoexec.cfg instead of the registry; copied over from the registry the first time
GameSettings=1

[Display]
; (HorPlus) Hor+ field of view on wide screens: the vertical view of 4:3, wider to the sides (90 -> 106 at 16:9)
HorPlus=1
; (ScaleMenus) the menus scaled up to fit the screen, aspect ratio kept (bars at the sides of a wide screen)
ScaleMenus=1
; (ScaleHUD) the in-game HUD scaled up
ScaleHud=1
; (HUDScale) the HUD's size in percent of the original pixels; 0 = the same scale as the menus
HudScale=0
; (IntegerScale) 1 = whole-number scales only (sharper, may leave a border)
IntegerScale=0
; (Borderless) 1 = borderless fullscreen: a window over the whole monitor, no display mode change (alt-tab is
; instant); the picture, at the resolution chosen in the game, is stretched to the monitor with its aspect ratio kept
; (the monitor's own resolution is the sharpest)
Borderless=0

[Performance]
; (TimerResolution) 1 ms timer resolution: the frame limiter (MaxFPS) no longer oversleeps
TimerResolution=1
; (PreciseFrameLimiter) a precise MaxFPS limiter (needs TimerResolution=1)
PreciseLimiter=1
; (FastMenus) menus present with one copy of the screen per frame instead of one per changed rectangle
FixMenus=1
; (FastConsole) the console's text with one lock of the screen per frame (not one per line), its background on the GPU
FixConsole=1

[Input]
; (FixDirectInput) dinput.dll / ASI builds: the game's DirectInput 7 bridged to DirectInput 8 by the built-in
; LANCommander Interposer. Modern Windows' dinput.dll overruns its device list while it enumerates HID devices: a hang
; or crash at startup. (Written to .interposer\Config.yml next to the patch when there is none; edit that file
; afterwards.)
FixDirectInput=1
; (KeyboardMouseOnly) 1 = the game sees only the keyboard and mouse (no device enumeration at all)
KeyboardMouseOnly=0

[Network]
; (ServerQueryPorts) the GameSpy query ports of a game server to ask for its voice and FastDL servers; empty = the one
; the server browser knows, 29801, and the game port + 1
QueryPorts=

[Voice]
; (VoiceEnable) voice chat with the players on the server (needs the patch on the server too, and the LANCommander
; Interposer: built into dinput.dll / lommpatch.asi, or the one that loads the plugin build)
; The keys are game controls (Options > Controls: "Voice: talk nearby", CapsLock; "Voice: team radio", X); the mode,
; volumes and microphone are in Options > Sound > Voice chat.
Enabled=1
; (VoicePort) the voice server's UDP port: the one a server listens on, and the one a client tries when the server
; does not say
Port=27800
; (VoicePassword) the voice server's password (both sides)
Password=
; (VoiceHost) connect to this voice server instead of the game server's (host or address)
Host=
; (VoiceActivation) 1 = talk to the players nearby whenever the microphone hears speech
VoiceActivation=0
; (VoiceVolume, VoiceMicVolume) volume of the voices, and of the microphone, in percent
Volume=100
MicVolume=100
; (VoiceMicrophone) the microphone's device id; empty = the default
Microphone=
; (VoiceShowTalkers) who is talking, on the HUD
ShowTalkers=1

[FastDL]
; (FastDLEnable) download missing custom worlds (Data\Worlds) from the FastDL server of the game server you join
Enabled=1
; (FastDLURL) the FastDL server to use when the game server does not name one (http://host:port/path/)
Url=

[RichPresence]
; (RichPresenceEnable) what you are doing (the menus; the world, game type, server and players in a game), shown in
; Discord and in the LANCommander launcher through the LANCommander Interposer
Enabled=1
; (DiscordApplicationID) dinput.dll / ASI builds: the id of a Discord application
; (discord.com/developers/applications) to show it in Discord; empty = the LANCommander launcher only. Added to
; .interposer\Config.yml next to the patch (RichPresence.Discord) when that file has no RichPresence section. The
; plugin build uses the Interposer's own RichPresence.Discord settings.
DiscordApplicationId=
; (DiscordLargeImage) the large image: an asset key of that Discord application, or an https:// URL; empty = none
LargeImage=

[Server]
; hosting (from the game, or the dedicated server LegendServ.exe)
; (VoiceServer) host a voice server, advertised in the server's query replies
VoiceServer=1
; (VoiceRange, VoiceFullVolumeRange) how far voices carry and how close they are at full volume, in metres
; (LithTech's 52.49 units per metre; empty = 50 and 4)
VoiceRange=
VoiceFullVolumeRange=
; (VoiceMaxPlayers, VoiceMaxBitrate, VoiceBindAddress, VoiceAdminKey) voice limits, the address to listen on
; (empty = all), and a key for the voice server's admin commands
VoiceMaxPlayers=32
VoiceMaxBitrate=32000
VoiceBindAddress=
VoiceAdminKey=
; (FastDLPort) advertise a FastDL server in the query replies (an HTTP server with Worlds/<name>.dat ...); 0 = none
FastDLPort=0
; (FastDLHost, FastDLPath) its host (empty = this server's address) and path (empty = /)
FastDLHost=
FastDLPath=

[Debug]
; (CrashLog) crashes logged with registers and a call chain
CrashLog=0
; (PerfLog) every 5 seconds, where a frame's time goes (presenting, the frame limiter, screen locks, blits, text)
PerfLog=0
